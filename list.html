<!DOCTYPE html>
<html>
<head>
    <title>List</title>
</head>
<body>
    <h1>Unorder list</h1>
    <ul>
        <li>John</li>
        <li>James</li>
        <li>Agnes</li>
        <li>Gloria</li>
    </ul>
    <h1>Ordered List</h1>
    <ol>
        <li>John</li>
        <li>James</li>
        <li>Agnes</li>
        <li>Gloria</li>
    </ol>
</body>
</html>
